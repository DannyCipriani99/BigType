name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BigType.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BigType-APK
          path: BigType.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-build${{ github.run_number }}"
          gh release create "$TAG" BigType.apk \
            --title "BigType $TAG" \
            --notes "Debug APK built automatically." \
            --target "${{ github.sha }}"
